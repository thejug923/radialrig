[project]
name = "radialrig"
version = "0.1.19"
description = "Governed-record retrieval, authoring, and validation tools that mount onto an existing project."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2,<3",
    # The mount reads and checks .codex/config.toml (PLAN-0013); the
    # standard library carries a TOML reader from 3.11 on.
    "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
radialrig = "radialrig.cli:main"
radialrig-read = "radialrig.retrieval_server:main"
radialrig-write = "radialrig.authoring_server:main"
radialrig-validate = "radialrig.validate_docs:main"
radialrig-index = "radialrig.generate_research_index:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
# 1.26 is the first hatchling that understands the SPDX license
# expression and license-files above.
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package directory carries the generated guidance corpus under
# data/; hatchling ships everything beneath it. The tests stay in the
# repository: an installed host has no use for them, and they import
# pytest, which a plain install does not carry.
packages = ["src/radialrig"]
exclude = ["src/radialrig/tests"]

[tool.hatch.build.targets.sdist]
include = ["src/radialrig", "pyproject.toml", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["src/radialrig/tests"]
